kind = "web"
previewPath = "/"
title = "ClipForge AI"
description = "A full-stack AI short-form video studio for generating original vertical videos, reviewing quality, and moving approved videos through a mock publishing queue."
version = "1.0.0"
id = "artifacts/clipforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26058

[services.development]
run = "pnpm --filter @workspace/clipforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clipforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/clipforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26058"
BASE_PATH = "/"
